services:
  api:
    build: .
    ports:
      - "8091:8091"
    env_file: .env
    environment:
      CONTESTA_DB: /data/contesta.db
    volumes:
      - contesta-data:/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8091

  # Prod/piloto: Postgres + pgvector para WeKnora y memoria Hindsight.
